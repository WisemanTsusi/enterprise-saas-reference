services:

  postgres:
    image: postgres:16
    container_name: enterprise-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: enterprise-saas-api
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/enterprise_saas
      JWT_SECRET: change-this-secret
    ports:
      - "3000:3000"

volumes:
  postgres_data: